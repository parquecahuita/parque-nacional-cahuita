<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Parque Nacional Cahuita</title>
    <meta name="description" content="Ponte en contacto para planificar tu visita al Parque Nacional Cahuita.">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <header class="header">
        <h1>Planea tu Visita</h1>
        <p>Envíanos tus dudas o consultas sobre el parque</p>
        <nav class="nav">
            <a href="../index.html">Inicio</a>
            <a href="senderos.html">Senderos</a>
            <a href="biodiversidad.html">Biodiversidad</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="hero">
            <h2>Formulario de Información</h2>
            <p>Horario de atención: Lunes a Domingo de 8:00 a.m. a 4:00 p.m.</p>
        </section>

        <section class="card" style="max-width: 600px; margin: 0 auto;">
            <form action="#" method="POST">
                <div style="margin-bottom: 1rem; text-align: left;">
                    <label for="nombre" style="display:block; margin-bottom: 0.5rem; font-weight: bold;">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 1rem; text-align: left;">
                    <label for="email" style="display:block; margin-bottom: 0.5rem; font-weight: bold;">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 1rem; text-align: left;">
                    <label for="mensaje" style="display:block; margin-bottom: 0.5rem; font-weight: bold;">Mensaje o Consulta:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;"></textarea>
                </div>
                <button type="submit" style="background-color: #0d5c75; color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 4px; cursor: pointer; font-weight: bold;">Enviar Consulta</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Parque Nacional Cahuita - Proyecto Web a la Medida</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
